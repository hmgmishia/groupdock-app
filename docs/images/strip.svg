<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-label="GroupDock の帯のイメージ">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3a67"/>
      <stop offset="1" stop-color="#6a4c93"/>
    </linearGradient>
  </defs>
  <rect width="880" height="200" rx="20" fill="url(#wall)"/>
  <rect x="40" y="62" width="800" height="96" rx="26" fill="#ffffff" fill-opacity="0.22" stroke="#ffffff" stroke-opacity="0.35"/>

  <!-- アプリ -->
  <rect x="64" y="80" width="56" height="56" rx="14" fill="#4cc9f0"/>
  <rect x="134" y="80" width="56" height="56" rx="14" fill="#f72585"/>
  <rect x="204" y="80" width="56" height="56" rx="14" fill="#80ed99"/>

  <!-- 仕切り -->
  <rect x="278" y="76" width="2" height="64" rx="1" fill="#ffffff" fill-opacity="0.5"/>

  <!-- グループ（フォルダ） -->
  <rect x="298" y="80" width="56" height="56" rx="14" fill="#ffffff" fill-opacity="0.3"/>
  <rect x="306" y="88" width="19" height="19" rx="5" fill="#ffd166"/>
  <rect x="327" y="88" width="19" height="19" rx="5" fill="#ef476f"/>
  <rect x="306" y="109" width="19" height="19" rx="5" fill="#06d6a0"/>
  <rect x="327" y="109" width="19" height="19" rx="5" fill="#118ab2"/>
  <rect x="368" y="80" width="56" height="56" rx="14" fill="#ffffff" fill-opacity="0.3"/>
  <rect x="376" y="88" width="19" height="19" rx="5" fill="#b5179e"/>
  <rect x="397" y="88" width="19" height="19" rx="5" fill="#7209b7"/>
  <rect x="376" y="109" width="19" height="19" rx="5" fill="#3a0ca3"/>

  <rect x="442" y="76" width="2" height="64" rx="1" fill="#ffffff" fill-opacity="0.5"/>

  <!-- ウィジェット：リング（音量） -->
  <rect x="460" y="80" width="56" height="56" rx="14" fill="#ffffff" fill-opacity="0.3"/>
  <circle cx="488" cy="108" r="17" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6"/>
  <circle cx="488" cy="108" r="17" fill="none" stroke="#ffd166" stroke-width="6" stroke-linecap="round" stroke-dasharray="77 107" transform="rotate(-90 488 108)"/>
  <text x="488" y="113" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">72</text>

  <!-- ウィジェット：時計 -->
  <rect x="530" y="80" width="112" height="56" rx="14" fill="#ffffff" fill-opacity="0.3"/>
  <text x="586" y="116" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">12:34</text>

  <!-- ウィジェット：バー（CPU） -->
  <rect x="656" y="80" width="112" height="56" rx="14" fill="#ffffff" fill-opacity="0.3"/>
  <text x="670" y="104" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">CPU 38%</text>
  <rect x="670" y="114" width="84" height="8" rx="4" fill="#ffffff" fill-opacity="0.35"/>
  <rect x="670" y="114" width="32" height="8" rx="4" fill="#80ed99"/>

  <!-- ページ送り -->
  <text x="800" y="116" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" fill-opacity="0.85" text-anchor="middle">◀ 1/2 ▶</text>

  <!-- 注記 -->
  <g font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.9" text-anchor="middle">
    <text x="162" y="40">アプリ</text>
    <text x="361" y="40">グループ（押すと吹き出し）</text>
    <text x="586" y="40">ウィジェット</text>
    <text x="790" y="40">ページ送り</text>
  </g>
  <g font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" fill-opacity="0.85" text-anchor="middle">
    <text x="488" y="182">ゲージ：ドラッグで調整</text>
    <text x="640" y="182">時計・日付・予定</text>
    <text x="772" y="182">CPU・メモリなど</text>
  </g>
</svg>
